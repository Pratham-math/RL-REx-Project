[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rexbench"
version = "0.1.0"
description = "Auditable local code repair experiments with REx bandit policies"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy", "pydantic>=2,<3", "PyYAML", "matplotlib", "docker"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "ruff", "mypy", "types-PyYAML", "pypdf"]

[project.scripts]
rexbench = "rexbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rexbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: real Linux container tests", "live: real local model tests", "slow: extended checks", "requires_dataset: official APPS required"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
